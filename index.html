<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mia Automation - AI Content for SEO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Netlify will detect this hidden stub at build time -->
    <form
      name="traffic-analysis"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <!-- Required hidden field so Netlify knows the form’s name -->
      <input type="hidden" name="form-name" value="traffic-analysis" />
      <!-- Honeypot field to trap bots -->
      <p>
        <label>
          Don’t fill this out if you’re human: <input name="bot-field" />
        </label>
      </p>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
